# Per-Agent Model Configuration
# 支持不同 Sub-IoA 使用不同模型和参数
# 如果某个 Sub-IoA 没有单独配置，则 fallback 到 agent_llm_config.yaml 的默认值
#
# NOTE: 统一模型测评模式下，所有角色使用相同模型、相同温度、相同参数。
# 以下配置已统一为 temperature=0.2。

finance:
  model: "gpt-4o-mini"
  temperature: 0.2
  max_completion_tokens: 16384

healthcare:
  model: "gpt-4o-mini"
  temperature: 0.2
  max_completion_tokens: 16384

travel:
  model: "gpt-4o-mini"
  temperature: 0.2
  max_completion_tokens: 16384

news:
  model: "gpt-4o-mini"
  temperature: 0.2
  max_completion_tokens: 16384
