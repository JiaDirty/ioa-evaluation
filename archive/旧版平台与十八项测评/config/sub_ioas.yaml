# IoA 测评环境子生态配置

sub_ioas:
  - id: finance
    name: "Finance-IoA"
    description: "金融子生态"
    agent_count: 5
    default_capabilities:
      - financial_analysis
      - risk_assessment
      - investment_advice
      - compliance_check
      - forecasting

  - id: healthcare
    name: "Healthcare-IoA"
    description: "医疗子生态"
    agent_count: 5
    default_capabilities:
      - clinical_analysis
      - drug_development
      - medical_data_analysis
      - insurance_review
      - public_health

  - id: travel
    name: "Travel-IoA"
    description: "旅行子生态"
    agent_count: 5
    default_capabilities:
      - flight_search
      - hotel_comparison
      - visa_requirements
      - itinerary_planning
      - travel_insurance

  - id: news
    name: "News-IoA"
    description: "新闻/知识子生态"
    agent_count: 5
    default_capabilities:
      - news_aggregation
      - fact_checking
      - sentiment_analysis
      - knowledge_graph
      - investigative_research

# 拓扑配置
topology:
  style: full_mesh  # full_mesh | star | chain

# 协议配置
protocols:
  supported:
    - a2a
    - mcp
    - private_api
  security_levels:
    a2a: 2
    mcp: 2
    private_api: 1
