# IoA 被测 Agent 模型配置示例
# 复制为 agent_llm_config.yaml 后填写本机接口地址和 API Key。
# 该文件可以提交；复制后的真实配置已被 .gitignore 排除。

provider: "openai"
model: "gpt-4o-mini"
api_key: "your-api-key-here"
base_url: "http://your-api-endpoint/v1/"  # OpenAI 兼容接口
temperature: 0.7
max_completion_tokens: 16384
context_window_tokens: 128000
model_max_completion_tokens: 16384
retry_count: 3
retry_delay: 1.0
timeout: 240
