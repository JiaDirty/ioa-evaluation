# IoA 测评环境 Docker Compose 配置
# MVP 阶段：本地多进程模式，无需外部依赖

version: "3.8"

services:
  # 主实验服务
  ioa-experiment:
    build: .
    volumes:
      - .:/app
      - ./results:/app/results
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    command: python run_experiment.py --demo

