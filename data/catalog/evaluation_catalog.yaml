schema_version: "1.1"
formal_track: ten_item_business_protocol
formal_runner: scripts/run_pipeline.py
formal_case_loader: src/evaluation/business_protocol/loader.py
formal_result_fields:
  - status
  - decision
  - answer
  - evidence_refs
  - next_action
  - handoff_message
  - decision_basis

categories:
  - order: 1
    code: CAS
    slug: cascade_propagation
    name_zh: 跨系统级联扩散
    mechanism: 范围错误的信息沿角色链传播并改变下游业务状态
    protocol_case_ids: [travel-scope-001]
    online_status: online_evaluated

  - order: 2
    code: CON
    slug: ecosystem_consensus
    name_zh: 生态错误共识
    mechanism: 多份同源报告被误当成多个独立证据
    protocol_case_ids: [batch-consensus-001]
    online_status: online_evaluated

  - order: 3
    code: RUM
    slug: rumor_spread
    name_zh: 谣言扩散
    mechanism: 未确认信息在交接中被逐步加工成确定事实
    protocol_case_ids: [station-rumor-001]
    online_status: online_evaluated

  - order: 4
    code: NOR
    slug: norm_drift
    name_zh: 规范漂移
    mechanism: 局部临时例外被泛化为长期共享规则
    protocol_case_ids: [purchase-norm-001]
    online_status: online_evaluated

  - order: 5
    code: INC
    slug: incentive_mismatch
    name_zh: 激励错配
    mechanism: 偏置绩效反馈诱导模型跳过必要核验
    protocol_case_ids: [invoice-incentive-001]
    online_status: online_evaluated

  - order: 6
    code: JUD
    slug: judgment_surrender
    name_zh: 判断让渡
    mechanism: 模型在缺少具体确认时替用户执行高影响决定
    protocol_case_ids: [travel-delegation-001]
    online_status: online_evaluated

  - order: 7
    code: DIS
    slug: discussion_distortion
    name_zh: 讨论扭曲
    mechanism: 共同控制账号被包装成多个独立参与者
    protocol_case_ids: [discussion-distortion-001]
    online_status: online_evaluated

  - order: 8
    code: AGE
    slug: agency_erosion
    name_zh: 能动性弱化
    mechanism: 低风险自动化授权被逐步扩大到高影响动作
    protocol_case_ids: [finance-agency-001]
    online_status: online_evaluated

  - order: 9
    code: TRA
    slug: trust_authorization
    name_zh: 信任与授权链
    mechanism: 授权在多角色传递中被扩大或被自行补全
    protocol_case_ids: [med-auth-drift-001, med-auth-vague-001]
    online_status: offline_validated

  - order: 10
    code: CRE
    slug: credential_declaration
    name_zh: 资格申报
    mechanism: 申报资质与真实档案不一致或未经核验即分配任务
    protocol_case_ids: [clin-task-declare-001]
    online_status: offline_validated

# 11 个叶级测评分支是正式数据集的唯一配额事实来源。
# 信任与授权链按子机制拆为两个叶分支。
branches:
  - branch_id: cas
    category: CAS
    name_zh: 跨系统级联扩散
    quota: 5
  - branch_id: con
    category: CON
    name_zh: 生态错误共识
    quota: 5
  - branch_id: rum
    category: RUM
    name_zh: 谣言扩散
    quota: 5
  - branch_id: nor
    category: NOR
    name_zh: 规范漂移
    quota: 5
  - branch_id: inc
    category: INC
    name_zh: 激励错配
    quota: 5
  - branch_id: jud
    category: JUD
    name_zh: 判断让渡
    quota: 5
  - branch_id: dis
    category: DIS
    name_zh: 讨论扭曲
    quota: 5
  - branch_id: age
    category: AGE
    name_zh: 能动性弱化
    quota: 5
  - branch_id: tra-drift
    category: TRA
    subtype: drift
    name_zh: 信任与授权链-授权转述漂移
    quota: 5
  - branch_id: tra-vague
    category: TRA
    subtype: vague
    name_zh: 信任与授权链-含糊授权越界
    quota: 5
  - branch_id: cre
    category: CRE
    name_zh: 资格申报
    quota: 5
