<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; }
      .layer-blue { fill: #eaf2ff; stroke: #2563eb; stroke-width: 3; }
      .layer-green { fill: #e9f7ef; stroke: #16803c; stroke-width: 3; }
      .layer-amber { fill: #fff4da; stroke: #b7791f; stroke-width: 3; }
      .box { fill: #ffffff; stroke: #b8c4d2; stroke-width: 2; rx: 12; }
      .box-blue { fill: #f8fbff; stroke: #78a8ff; stroke-width: 2; rx: 12; }
      .box-green { fill: #fbfffc; stroke: #75c991; stroke-width: 2; rx: 12; }
      .box-amber { fill: #fffdf7; stroke: #e1b85c; stroke-width: 2; rx: 12; }
      .box-violet { fill: #fbf8ff; stroke: #a78bfa; stroke-width: 2; rx: 12; }
      .title { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #182230; }
      .subtitle { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 18px; fill: #667085; }
      .layer-title { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #182230; }
      .text { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 18px; fill: #182230; }
      .small { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 15px; fill: #475467; }
      .tiny { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #667085; }
      .blue-text { fill: #2563eb; font-weight: 800; }
      .green-text { fill: #16803c; font-weight: 800; }
      .amber-text { fill: #b7791f; font-weight: 800; }
      .violet-text { fill: #6d28d9; font-weight: 800; }
      .arrow { stroke: #475467; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-green { stroke: #16803c; stroke-width: 3; fill: none; marker-end: url(#arrowhead-green); }
      .dash { stroke-dasharray: 8 7; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#475467" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#16803c" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050" />

  <text class="title" x="70" y="66">IoA 层智能体安全测评架构图</text>
  <text class="subtitle" x="70" y="98">数据驱动场景 + 开放智能体生态基础设施 + 风险攻击注入 + 审计与指标报告</text>

  <!-- Left input column -->
  <rect class="panel" x="55" y="150" width="260" height="760" rx="16" />
  <text class="layer-title" x="85" y="190">输入与基准</text>

  <rect class="box-violet" x="85" y="225" width="200" height="94" />
  <text class="text violet-text" x="105" y="258">18 条 Seed JSON</text>
  <text class="tiny" x="105" y="285">风险维度 / 场景 / 任务</text>
  <text class="tiny" x="105" y="305">攻击 / 防御 / 预期指标</text>

  <rect class="box-violet" x="85" y="350" width="200" height="94" />
  <text class="text violet-text" x="105" y="383">风险分类体系</text>
  <text class="tiny" x="105" y="410">6 类风险</text>
  <text class="tiny" x="105" y="430">18 个子风险</text>

  <rect class="box-violet" x="85" y="475" width="200" height="112" />
  <text class="text violet-text" x="105" y="508">测试注册表</text>
  <text class="tiny" x="105" y="535">risk_tests/registry.py</text>
  <text class="tiny" x="105" y="555">ALL_TESTS</text>

  <rect class="box-violet" x="85" y="620" width="200" height="112" />
  <text class="text violet-text" x="105" y="653">配置文件</text>
  <text class="tiny" x="105" y="680">Agent LLM Config</text>
  <text class="tiny" x="105" y="700">Judge LLM Config</text>

  <rect class="box-violet" x="85" y="765" width="200" height="94" />
  <text class="text violet-text" x="105" y="798">运行入口</text>
  <text class="tiny" x="105" y="825">run_experiment.py</text>
  <text class="tiny" x="105" y="845">--scenario-dir data/seeds</text>

  <!-- Main architecture area -->
  <rect class="layer-blue" x="355" y="145" width="890" height="215" rx="18" />
  <text class="layer-title blue-text" x="385" y="185">实验控制层 Experiment Control Layer</text>
  <text class="small" x="385" y="214">负责编排实验、加载场景、构建拓扑、注入攻击、计算指标、生成报告</text>

  <rect class="box-blue" x="385" y="240" width="160" height="76" />
  <text class="text" x="405" y="272">Scenario</text>
  <text class="small" x="405" y="296">Loader</text>

  <rect class="box-blue" x="565" y="240" width="175" height="76" />
  <text class="text" x="585" y="272">IoA</text>
  <text class="small" x="585" y="296">Environment</text>

  <rect class="box-blue" x="760" y="240" width="175" height="76" />
  <text class="text" x="780" y="272">Topology</text>
  <text class="small" x="780" y="296">Controller</text>

  <rect class="box-blue" x="955" y="240" width="120" height="76" />
  <text class="text" x="975" y="272">Attack</text>
  <text class="small" x="975" y="296">Injector</text>

  <rect class="box-blue" x="1095" y="240" width="120" height="76" />
  <text class="text" x="1115" y="272">LLM</text>
  <text class="small" x="1115" y="296">Judge</text>

  <rect class="layer-green" x="355" y="395" width="890" height="225" rx="18" />
  <text class="layer-title green-text" x="385" y="435">IoA 基础设施层 Infrastructure Layer</text>
  <text class="small" x="385" y="464">可控 IoA testbed 中的公共注册、任务市场、协议适配、共享知识和全局审计</text>

  <rect class="box-green" x="385" y="492" width="150" height="82" />
  <text class="text" x="405" y="525">Global</text>
  <text class="small" x="405" y="549">Registry</text>

  <rect class="box-green" x="555" y="492" width="160" height="82" />
  <text class="text" x="575" y="525">Task</text>
  <text class="small" x="575" y="549">Marketplace</text>

  <rect class="box-green" x="735" y="492" width="150" height="82" />
  <text class="text" x="755" y="525">Protocol</text>
  <text class="small" x="755" y="549">Adapter</text>

  <rect class="box-green" x="905" y="492" width="150" height="82" />
  <text class="text" x="925" y="525">Shared</text>
  <text class="small" x="925" y="549">Knowledge</text>

  <rect class="box-green" x="1075" y="492" width="140" height="82" />
  <text class="text" x="1095" y="525">Global</text>
  <text class="small" x="1095" y="549">Audit</text>

  <rect class="layer-amber" x="355" y="655" width="890" height="270" rx="18" />
  <text class="layer-title amber-text" x="385" y="695">Sub-IoA 子生态层</text>
  <text class="small" x="385" y="724">每个子生态拥有本地注册表、本地审计、唯一 Gateway 和领域 Agent，跨域协作经 Gateway 中继</text>

  <g id="sub-ioa-finance">
    <rect class="box-amber" x="385" y="760" width="190" height="120" />
    <text class="text amber-text" x="410" y="792">Finance IoA</text>
    <text class="tiny" x="410" y="820">Local Registry</text>
    <text class="tiny" x="410" y="842">finance-gw</text>
    <text class="tiny" x="410" y="864">Finance Agents</text>
  </g>

  <g id="sub-ioa-healthcare">
    <rect class="box-amber" x="600" y="760" width="190" height="120" />
    <text class="text amber-text" x="625" y="792">Healthcare IoA</text>
    <text class="tiny" x="625" y="820">Local Registry</text>
    <text class="tiny" x="625" y="842">healthcare-gw</text>
    <text class="tiny" x="625" y="864">Medical Agents</text>
  </g>

  <g id="sub-ioa-travel">
    <rect class="box-amber" x="815" y="760" width="190" height="120" />
    <text class="text amber-text" x="840" y="792">Travel IoA</text>
    <text class="tiny" x="840" y="820">Local Registry</text>
    <text class="tiny" x="840" y="842">travel-gw</text>
    <text class="tiny" x="840" y="864">Travel Agents</text>
  </g>

  <g id="sub-ioa-news">
    <rect class="box-amber" x="1030" y="760" width="190" height="120" />
    <text class="text amber-text" x="1055" y="792">News IoA</text>
    <text class="tiny" x="1055" y="820">Local Registry</text>
    <text class="tiny" x="1055" y="842">news-gw</text>
    <text class="tiny" x="1055" y="864">News Agents</text>
  </g>

  <!-- Right output column -->
  <rect class="panel" x="1285" y="150" width="260" height="760" rx="16" />
  <text class="layer-title" x="1315" y="190">输出与展示</text>

  <rect class="box" x="1315" y="225" width="200" height="94" />
  <text class="text blue-text" x="1335" y="258">测试报告</text>
  <text class="tiny" x="1335" y="285">summary</text>
  <text class="tiny" x="1335" y="305">category_breakdown</text>

  <rect class="box" x="1315" y="350" width="200" height="94" />
  <text class="text blue-text" x="1335" y="383">任务结果</text>
  <text class="tiny" x="1335" y="410">task_results</text>
  <text class="tiny" x="1335" y="430">artifacts</text>

  <rect class="box" x="1315" y="475" width="200" height="112" />
  <text class="text blue-text" x="1335" y="508">审计证据</text>
  <text class="tiny" x="1335" y="535">trace_id</text>
  <text class="tiny" x="1335" y="555">source / protocol / auth</text>

  <rect class="box" x="1315" y="620" width="200" height="112" />
  <text class="text blue-text" x="1335" y="653">指标体系</text>
  <text class="tiny" x="1335" y="680">Utility / Safety</text>
  <text class="tiny" x="1335" y="700">Traceability / Containment</text>

  <rect class="box" x="1315" y="765" width="200" height="94" />
  <text class="text blue-text" x="1335" y="798">前端展示</text>
  <text class="tiny" x="1335" y="825">api/main.py</text>
  <text class="tiny" x="1335" y="845">frontend/</text>

  <!-- Arrows from inputs -->
  <path class="arrow-blue" d="M285 272 C320 272, 335 272, 385 272" />
  <path class="arrow-blue" d="M285 522 C320 522, 335 282, 385 282" />
  <path class="arrow-blue" d="M285 812 C320 812, 330 278, 385 278" />

  <!-- Layer vertical arrows -->
  <path class="arrow-green" d="M653 316 L653 492" />
  <path class="arrow-green" d="M635 574 L635 760" />
  <path class="arrow" d="M847 316 L847 492" />
  <path class="arrow" d="M1015 316 L1015 492" />
  <path class="arrow" d="M1145 574 L1145 760" />

  <!-- Infrastructure relation arrows -->
  <path class="arrow dash" d="M535 533 L555 533" />
  <path class="arrow dash" d="M715 533 L735 533" />
  <path class="arrow dash" d="M885 533 L905 533" />
  <path class="arrow dash" d="M1055 533 L1075 533" />

  <!-- Sub-IoA cross-domain arrows -->
  <path class="arrow-green dash" d="M575 820 C590 735, 785 735, 815 820" />
  <path class="arrow-green dash" d="M790 820 C805 735, 1000 735, 1030 820" />
  <path class="arrow-green dash" d="M575 850 C710 925, 1040 925, 1030 850" />
  <text class="tiny" x="690" y="744">跨域发现 / 协议协商 / Gateway 中继</text>

  <!-- Outputs arrows -->
  <path class="arrow-blue" d="M1215 278 C1250 278, 1265 272, 1315 272" />
  <path class="arrow-blue" d="M1215 533 C1250 533, 1265 522, 1315 522" />
  <path class="arrow-blue" d="M1220 820 C1250 820, 1265 812, 1315 812" />

  <!-- Bottom flow strip -->
  <rect class="panel" x="55" y="945" width="1490" height="62" rx="14" />
  <text class="small" x="85" y="982">
    执行主线：Seed JSON → ScenarioLoader → IoAEnvironment.setup_from_scenario → TaskMarketplace → Gateway 8 步流程 → Agent/LLM 执行 → Audit &amp; Artifact → Judge/Metrics → JSON Report / Frontend
  </text>
</svg>
