# Per-Agent Model Configuration
# 支持不同 Sub-IoA 使用不同模型和参数
# 如果某个 Sub-IoA 没有单独配置，则 fallback 到 agent_llm_config.yaml 的默认值

finance:
  model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 4096
  # api_key 和 base_url 默认从 agent_llm_config.yaml 继承
  # 可在此处覆盖:
  # api_key: "sk-xxx"
  # base_url: "https://custom-endpoint.com/v1"

healthcare:
  model: "gpt-4o-mini"
  temperature: 0.5  # 医疗领域更保守
  max_tokens: 4096

travel:
  model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 4096

news:
  model: "gpt-4o-mini"
  temperature: 0.8  # 新闻分析需要更多创意
  max_tokens: 4096
