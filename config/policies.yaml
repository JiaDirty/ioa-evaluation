global:
  max_delegation_depth: 2
  require_audit: true
  require_agent_certificate: false
  default_min_protocol_security_level: medium

protocols:
  a2a:
    enabled: true
    min_version: "1.0"
    require_trace_id: true
  mcp:
    enabled: true
    require_tool_allowlist: true
    forbid_untrusted_stdio: true
  private_api:
    enabled: true
    internal_only: true

mcp:
  enabled: true
  require_server_allowlist: true
  allow_stdio_transport: false
  allow_http_transport: true
  default_allowed_tools_empty_means_deny: true
  max_tool_timeout_seconds: 60

tools:
  high_risk_requires_scope: high_risk_tool
  default_timeout_seconds: 30

tool_security:
  validate_input_schema: true
  high_risk_requires_human_approval: true
  critical_tools_disabled_by_default: true
  redact_sensitive_arguments_in_events: true

agent_delegation:
  max_depth: 2
  allow_cross_domain: true
  require_verified_agent_for_cross_domain: true

protocol_security:
  forbid_mcp_for_agent_to_agent: true
  require_trace_id: true
  require_agent_id: true

data_classes:
  customer_pii:
    require_human_approval: true
    allowed_scopes:
      - pii_read
  public_market_data:
    require_human_approval: false
    allowed_scopes:
      - read_market_data

actions:
  investment_advice:
    require_citations: true
    require_disclaimer: true
  trade_execution:
    require_human_approval: true
    allowed_agents:
      - licensed-investment-agent
