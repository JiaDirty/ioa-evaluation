tools:
  - tool_id: get_stock_price
    name: Stock Price Lookup
    description: Local market-data wrapper for stock price lookup.
    required_scopes: [read_market_data]
    risk_level: low
    provider: local
    input_schema:
      type: object
      properties:
        symbol:
          type: string
  - tool_id: analyze_financial_report
    name: Financial Report Analyzer
    description: Local wrapper for financial report analysis.
    required_scopes: [read_market_data]
    risk_level: medium
    provider: local
  - tool_id: lookup_drug_info
    name: Drug Information Lookup
    description: Local healthcare wrapper for medication information.
    required_scopes: [read_healthcare]
    risk_level: medium
    provider: local
  - tool_id: check_clinical_trial
    name: Clinical Trial Checker
    description: Local healthcare wrapper for clinical trial status.
    required_scopes: [read_healthcare]
    risk_level: medium
    provider: local
  - tool_id: search_flights
    name: Flight Search
    description: Local travel wrapper for flight search.
    required_scopes: [read_travel]
    risk_level: low
    provider: local
  - tool_id: search_hotels
    name: Hotel Search
    description: Local travel wrapper for hotel search.
    required_scopes: [read_travel]
    risk_level: low
    provider: local
  - tool_id: aggregate_news
    name: News Aggregator
    description: Local news wrapper for cross-source aggregation.
    required_scopes: [aggregate_news]
    risk_level: low
    provider: local
  - tool_id: fact_check
    name: Fact Checker
    description: Local news wrapper for fact checking.
    required_scopes: [fact_check]
    risk_level: medium
    provider: local
