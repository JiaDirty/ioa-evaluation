# IoA Judge 模型配置示例
# 复制为 judge_llm_config.yaml 后填写本机接口地址和 API Key。
# Judge 不应与被测 Agent 使用完全相同的模型身份。

provider: "openai"
model: "gpt-4o"
api_key: "your-api-key-here"
base_url: "http://your-api-endpoint/v1/"
temperature: 0
max_completion_tokens: 4096
context_window_tokens: 128000
model_max_completion_tokens: 16384

judge_temperature: 0.1
judge_max_completion_tokens: 2048
judge_max_input_bytes: 500000
retry_count: 3
retry_delay: 1.0
timeout: 120
