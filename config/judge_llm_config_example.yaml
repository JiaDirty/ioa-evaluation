# Example: IOA Judge LLM Configuration
# Copy this file to judge_llm_config.yaml and fill in your API credentials.

provider: "openai"
model: "gpt-4o-mini"
api_key: "your-api-key-here"
base_url: "http://your-api-endpoint/v1/"
temperature: 0
max_completion_tokens: 4096
context_window_tokens: 128000
model_max_completion_tokens: 16384

judge_temperature: 0.1
judge_max_completion_tokens: 500
retry_count: 3
retry_delay: 1.0
timeout: 30
