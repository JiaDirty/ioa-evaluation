servers:
  - server_id: local-demo-mcp
    name: Local Demo MCP Server
    enabled: false
    transport: http
    endpoint: http://127.0.0.1:9100/mcp
    auth:
      type: none
    allowed_tools:
      - demo_echo
      - demo_lookup
    timeout_seconds: 30
    risk_level: low

  - server_id: filesystem-mcp
    name: Filesystem MCP Server
    enabled: false
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "./data"
    auth:
      type: none
    allowed_tools: []
    timeout_seconds: 30
    risk_level: medium
    sandbox:
      allowed_paths:
        - "./data"
